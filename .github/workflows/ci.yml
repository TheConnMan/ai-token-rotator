name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install jq, curl, and shellcheck
        run: sudo apt-get update && sudo apt-get install -y jq curl shellcheck

      - name: shellcheck
        run: shellcheck *.sh

      - name: Claude tests
        run: bash tests/run_tests.sh

      - name: Codex tests
        run: bash tests/run_codex_tests.sh
